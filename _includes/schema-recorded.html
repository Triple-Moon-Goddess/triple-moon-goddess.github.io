<script type="application/ld+json">
{
  "@context": "https://schema.org",
  "@graph": [
{%- for v in site.data.recorded %}
{%- capture v_desc -%}
{{ v.title }} — {{ v.location }}, {{ v.date | date: "%B %-d, %Y" }}{% if v.time %}, {{ v.time }}{% endif %}.
{%- endcapture %}
    {
      "@type": "VideoObject",
      "name": {{ v.title | jsonify }},
      "description": {{ v_desc | strip | jsonify }},
      "thumbnailUrl": "https://i.ytimg.com/vi/{{ v.youtube_id }}/hqdefault.jpg",
      "uploadDate": {{ v.date | jsonify }},
      "embedUrl": "https://www.youtube-nocookie.com/embed/{{ v.youtube_id }}",
      "contentUrl": "https://www.youtube.com/watch?v={{ v.youtube_id }}",
      "author": { "@id": "https://triplemoongoddess.com/#lisa" },
      "publisher": { "@id": "https://triplemoongoddess.com/#org" },
      "url": "https://triplemoongoddess.com/recorded.html"
    }{% unless forloop.last %},{% endunless %}
{%- endfor %}
  ]
}
</script>
