<script id="tmg-chrome-js">
/* Some pages pad <body> themselves. Pull the chrome out to the page edges
   so the bar is full-bleed, without editing that page's own CSS. */
(function () {
  var cs = getComputedStyle(document.body);
  var px = function (v) { return parseFloat(v) || 0; };
  var t = px(cs.paddingTop), r = px(cs.paddingRight),
      b = px(cs.paddingBottom), l = px(cs.paddingLeft);
  var nav = document.querySelector('.tmg-nav');
  var foot = document.querySelector('.tmg-footer');
  if (nav && (t || r || l)) { nav.style.margin = -t + 'px ' + -r + 'px 0 ' + -l + 'px'; }
  if (foot && (r || b || l)) { foot.style.margin = '0 ' + -r + 'px ' + -b + 'px ' + -l + 'px'; }
})();
</script>
