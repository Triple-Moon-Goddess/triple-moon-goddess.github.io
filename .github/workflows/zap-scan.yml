name: ZAP Scan

# OWASP ZAP baseline (passive) scan of the live website, triplemoongoddess.com
# (BAA readiness; Lisa, 2026-10-14). Passive only: GETs of the site's pages, no
# forms, no attacks.
#
# Runs after every publish (called by deploy-firebase.yml after its Firebase
# deploy; page_build while the site is still on GitHub Pages), Mondays 09:27 UTC,
# and by hand.
# The report is kept as an artifact, the findings are emailed to Lisa on every
# run, and a finding of Low risk or higher fails the run (Informational findings
# are listed, not failed) — the same rules as the app repo's zap-scan.yml.
# Findings Lisa decided on (.hosting/zap-decisions.json) are listed with her note
# and do not count.
# ZAP never files GitHub issues.

on:
  workflow_call:
    inputs:
      site:
        type: string
        default: prod
  page_build:
  schedule:
    - cron: '27 9 * * 1'
  workflow_dispatch:
    inputs:
      site:
        description: 'prod = triplemoongoddess.com; dev = the dev copy on Firebase (triplemoongoddess-site-dev.web.app)'
        required: true
        default: prod
        type: choice
        options: [prod, dev]

permissions:
  contents: read
  pages: read

concurrency:
  group: zap-site
  cancel-in-progress: false

env:
  TARGET: ${{ inputs.site == 'dev' && 'https://triplemoongoddess-site-dev.web.app/' || 'https://triplemoongoddess.com/' }}

jobs:
  baseline:
    name: Baseline (passive) triplemoongoddess.com
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Wait for the published build
        if: github.event_name == 'page_build'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          for i in $(seq 1 40); do
            status=$(gh api "repos/${{ github.repository }}/pages/builds/latest" --jq .status)
            echo "pages build: $status"
            [ "$status" = "built" ] && exit 0
            [ "$status" = "errored" ] && { echo "The site build errored — scanning what is live."; exit 0; }
            sleep 15
          done
          echo "The site build did not finish in 10 minutes — scanning what is live."

      - name: ZAP baseline scan
        uses: zaproxy/action-baseline@de8ad967d3548d44ef623df22cf95c3b0baf8b25 # v0.15.0
        with:
          target: ${{ env.TARGET }}
          cmd_options: '-a'
          allow_issue_writing: false
          fail_action: false
          artifact_name: zap-baseline-site

      - uses: actions/checkout@v6
        if: always()
        with:
          path: repo
      - id: sum
        name: Alert counts and findings (decided findings listed, not counted)
        if: always()
        run: |
          bash repo/.hosting/zap-summary.sh report_json.json "ZAP baseline (passive) scan — ${TARGET}" zap-summary.md >> "$GITHUB_OUTPUT"
          cat zap-summary.md >> "$GITHUB_STEP_SUMMARY"

      - name: Email the findings to Lisa
        if: always()
        uses: dawidd6/action-send-mail@v3
        with:
          server_address: smtp.gmail.com
          server_port: 465
          secure: true
          username: ${{ secrets.LISA_CONTACT_EMAIL }}
          password: ${{ secrets.GMAIL_APP_PASSWORD }}
          to: ${{ secrets.LISA_CONTACT_EMAIL }}
          from: "TMG Security Bot <${{ secrets.LISA_CONTACT_EMAIL }}>"
          subject: ${{ steps.sum.outputs.subject }}
          convert_markdown: true
          html_body: file://zap-summary.md
          body: |
            ${{ steps.sum.outputs.subject }}
            Trigger: ${{ github.event_name }} (commit ${{ github.sha }})
            Run (the report is its artifact):
            https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}
          attachments: zap-summary.md

      - name: A finding fails the run
        if: always()
        run: exit "${{ steps.sum.outputs.rc || 1 }}"
