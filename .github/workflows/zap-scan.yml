name: ZAP Scan

# OWASP ZAP baseline (passive) scan of the live website, triplemoongoddess.com
# (BAA readiness; Lisa, 2026-10-14). Passive only: GETs of the site's pages, no
# forms, no attacks.
#
# Runs after every publish (called by deploy-firebase.yml after its Firebase
# deploy; page_build while the site is still on GitHub Pages), Mondays 09:27 UTC,
# and by hand.
# The report is kept as an artifact, the findings are emailed to Lisa when the
# run fails (Lisa, 2026-10-18: email only when there is a problem), and ANY finding fails the run, Informational included (Lisa, 2026-10-18)
# — the same rules as the app repo's zap-scan.yml.
# Findings Lisa decided on (.hosting/zap-decisions.json) are listed with her note
# and do not count.
# ZAP never files GitHub issues.

on:
  workflow_call:
    inputs:
      site:
        type: string
        default: prod
  page_build:
  schedule:
    - cron: '27 9 * * 1'
  workflow_dispatch:
    inputs:
      site:
        description: 'prod = triplemoongoddess.com; firebase = the deployed Firebase site (triplemoongoddess-website.web.app); dev = the dev copy'
        required: true
        default: prod
        type: choice
        options: [prod, firebase, dev]
      test_mail:
        description: 'Send the findings email even when the scan passes (to test the mail path)'
        type: boolean
        default: false

permissions:
  contents: read
  pages: read
  id-token: write   # the findings email signs in by Workload Identity Federation

concurrency:
  group: zap-site
  cancel-in-progress: false

env:
  TARGET: ${{ inputs.site == 'dev' && 'https://triplemoongoddess-site-dev.web.app/' || inputs.site == 'firebase' && 'https://triplemoongoddess-website.web.app/' || 'https://triplemoongoddess.com/' }}

jobs:
  baseline:
    name: Baseline (passive) triplemoongoddess.com
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Wait for the published build
        if: github.event_name == 'page_build'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          for i in $(seq 1 40); do
            status=$(gh api "repos/${{ github.repository }}/pages/builds/latest" --jq .status)
            echo "pages build: $status"
            [ "$status" = "built" ] && exit 0
            [ "$status" = "errored" ] && { echo "The site build errored — scanning what is live."; exit 0; }
            sleep 15
          done
          echo "The site build did not finish in 10 minutes — scanning what is live."

      - name: ZAP baseline scan
        uses: zaproxy/action-baseline@de8ad967d3548d44ef623df22cf95c3b0baf8b25 # v0.15.0
        with:
          target: ${{ env.TARGET }}
          cmd_options: '-a'
          allow_issue_writing: false
          fail_action: false
          artifact_name: zap-baseline-site

      - uses: actions/checkout@v6
        if: always()
        with:
          path: repo
      - id: sum
        name: Alert counts and findings (decided findings listed, not counted)
        if: always()
        run: |
          node repo/.hosting/zap-summary.cjs report_json.json "ZAP baseline (passive) scan — ${TARGET}" zap-summary.md >> "$GITHUB_OUTPUT"
          cat zap-summary.md >> "$GITHUB_STEP_SUMMARY"

      # Email only when there is a problem (Lisa, 2026-10-18): a finding, or no report.
      - name: Sign in to Google Cloud for the mail sender (Workload Identity Federation)
        if: always() && (steps.sum.outputs.rc != '0' || inputs.test_mail)
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: projects/770432131793/locations/global/workloadIdentityPools/github-pool/providers/github-website
          service_account: gh-website-deploy@triplemoongoddess-website.iam.gserviceaccount.com
      # No app password (Workspace audit ADD-34): Gmail API, send-only, as Lisa.
      - name: Email the findings to Lisa
        if: always() && (steps.sum.outputs.rc != '0' || inputs.test_mail)
        env:
          LISA_EMAIL: ${{ secrets.LISA_CONTACT_EMAIL }}
          MAIL_TO: ${{ secrets.LISA_CONTACT_EMAIL }}
          MAIL_FROM: "TMG Security Bot <${{ secrets.LISA_CONTACT_EMAIL }}>"
          MAIL_SUBJECT: ${{ inputs.test_mail && format('[test] {0}', steps.sum.outputs.subject) || steps.sum.outputs.subject }}
          MAIL_ATTACHMENT: zap-summary.md
          MAIL_BODY: |
            ${{ steps.sum.outputs.subject }}
            Trigger: ${{ github.event_name }} (commit ${{ github.sha }})
            Run (the report is its artifact):
            https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}
            The findings are attached (zap-summary.md).
        run: node repo/.hosting/send-mail.cjs

      - name: A finding fails the run
        if: always()
        run: exit "${{ steps.sum.outputs.rc || 1 }}"
