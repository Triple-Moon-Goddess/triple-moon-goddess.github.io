name: Build and deploy (Firebase Hosting)

# triplemoongoddess.com on Firebase Hosting (Lisa, 2026-10-14: moved off GitHub
# Pages so the site can send security headers). On every push to main:
#   build   Jekyll with the GitHub Pages gem set and its default plugins
#           (.hosting/Gemfile, .hosting/_config.pages-defaults.yml), then the
#           hosting config with its security headers from the built pages
#           (.hosting/build-config.cjs refuses anything the CSP would block)
#   deploy  to Firebase project triplemoongoddess-website (its own project, so this
#           repo can never touch the apps), keyless (Workload Identity
#           Federation; this repo's main branch only)
#   scan    the OWASP ZAP baseline of the deployed Firebase site (zap-scan.yml): report kept,
#           findings emailed to Lisa, any finding (Informational included) fails the run

on:
  push:
    branches: [main, firebase-hosting]   # firebase-hosting builds only; deploy runs on main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-firebase-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      BUNDLE_GEMFILE: ${{ github.workspace }}/.hosting/Gemfile
    steps:
      - uses: actions/checkout@v6
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.3'
          bundler-cache: true
      - name: Build the site
        run: bundle exec jekyll build --config _config.yml,.hosting/_config.pages-defaults.yml --destination _site
        env:
          JEKYLL_ENV: production
          PAGES_REPO_NWO: ${{ github.repository }}
          JEKYLL_GITHUB_TOKEN: ${{ github.token }}
      - name: Hosting config + security headers from the built pages (scripts minified first)
        run: |
          npm ci --prefix .hosting --no-audit --no-fund
          node .hosting/zap-summary.test.cjs
          node .hosting/point-app-links.test.cjs
          node .hosting/build-config.test.cjs
          node .hosting/send-mail.test.cjs
          node .hosting/build-config.cjs _site .hosting/firebase.json
      - uses: actions/upload-artifact@v4
        with:
          name: site-build
          include-hidden-files: true
          path: |
            _site
            .hosting/firebase.json

  deploy:
    needs: build
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: site-build
      - uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: projects/770432131793/locations/global/workloadIdentityPools/github-pool/providers/github-website
          service_account: gh-website-deploy@triplemoongoddess-website.iam.gserviceaccount.com
      - name: Deploy to Firebase Hosting (triplemoongoddess-website)
        run: |
          jq '.hosting.site = "triplemoongoddess-website" | .hosting.public = "_site"' .hosting/firebase.json > firebase.json
          npx -y firebase-tools@15.22.3 deploy --only hosting --project triplemoongoddess-website --non-interactive

  scan:
    needs: deploy
    # The called workflow reads Pages build status; a called workflow can only use
    # permissions its caller grants (without this, GitHub refuses to start the run).
    permissions:
      contents: read
      pages: read
      id-token: write
    uses: ./.github/workflows/zap-scan.yml
    with:
      site: firebase
    secrets: inherit
