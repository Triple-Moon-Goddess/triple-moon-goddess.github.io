# Version history for the site's published documents (Security Brief, Privacy
# Policy, Terms of Service). Newest first. The first entry of each list is the
# current version: its stamp shows at the top of the page (_includes/doc-version.html)
# and the whole list shows at the bottom (_includes/version-history.html).
# Version names follow the privacy policy's scheme: vYYYY-MM, then a letter
# suffix (b, c, ...) for a further version in the same month.
# Privacy details: legal/PRIVACY_CHANGELOG.md. Update both in the same commit.

security:
  - version: v2026-10d
    date: October 20, 2026
    summary: Deleting client data also deletes the client's MailerLite subscriber, booking events and Stripe customer, retrying and alerting Lisa if a step fails. Records of app use, AI rate counters and unused anonymous sessions are deleted automatically. What the logs hold is stated exactly, including the email addresses some entries carry. Every production release is first scanned with Semgrep against our own security rules, offline, and any finding stops it. A tenth breach alert watches for changes to the email encryption key's versions.
  - version: v2026-10c
    date: October 20, 2026
    summary: Deleting client data removes every sign-in account that held only that client's records, not just the email sign-in. A cancelled practitioner's records are deleted when the paid period ends, not at the moment of cancelling.
  - version: v2026-10b
    date: October 18, 2026
    summary: Published on the website. Every statement re-checked against the code and the live system; wording corrected where the October 13 edition overstated the controls, and the documents offered on request limited to those that exist; a third-party penetration test is arranged on request.
  - version: v2026-10
    date: October 13, 2026
    summary: First edition, a two-page PDF.

privacy:
  - version: v2026-10i
    date: October 20, 2026
    summary: Deleted files clear from storage within 14 days. File storage now keeps a deleted file's earlier version for 7 days before the 7-day recovery copy, so a deleted reading PDF, video or preview is fully gone within 14 days. The isolated backup copy is kept 31 days, and its recovery copy is removed within about 9 more days.
  - version: v2026-10h
    date: October 20, 2026
    summary: Where your data is says where each processor stores it (Anthropic in the US, Stripe including the US and India, MailerLite in the European Union, Google Workspace wherever Google has facilities); only TMG's own systems are US-only. Records of which app a session opened are deleted after 1 year, old AI summary counters after 30 days, and anonymous sign-in sessions after a year unused. Deleting your data also deletes your MailerLite subscriber record, your booking events (a future session is cancelled) and your Stripe customer record. The log rows say exactly which entries hold an email address.
  - version: v2026-10g
    date: October 20, 2026
    summary: The Health Journal also exports Markdown with a machine-readable copy; deleting your data also removes an anonymous sign-in that held only your charts; stopping sharing with a practitioner deletes nothing; your records close to them, and the notes they wrote stay theirs.
  - version: v2026-10f
    date: October 19, 2026
    summary: Deleted files clear from storage within 7 days. A deleted reading PDF's recovery copy is removed automatically within 7 days, and video readings and previews are deleted about 7 days after they are made, with their recovery copy removed within 7 more days.
  - version: v2026-10e
    date: October 19, 2026
    summary: The website contact form is handled by Triple Moon Goddess's own server instead of Formspree; it asks for no name, stores nothing, and its email to Lisa is deleted after 30 days. Formspree removed from the processors.
  - version: v2026-10d
    date: October 19, 2026
    summary: US-only. TMG offers its services in the United States and does not target people elsewhere; the GDPR, UK, Brazil, Canada and Australia sections and GDPR legal-basis wording are replaced by one set of rights for everyone, California and other states, a written appeal process, and the new Consumer Health Data Privacy Policy (Washington My Health My Data Act).
  - version: v2026-10c
    date: October 18, 2026
    summary: Data location corrected — TMG's databases, files, backups, keys and servers are in the United States only (the earlier "US and EU data centres" was not accurate). Chart emails now carry a newsletter unsubscribe link.
  - version: v2026-10b
    date: October 18, 2026
    summary: Brought in line with the BAA-readiness changes shipped October 7–18, 2026 — client sign-in by email link, two-step sign-in for practitioners, keyed email fingerprints, practitioner AI on the practitioner's own key, invitation and consent for practitioner clients, audit-log and link retention, and the mailbox purge.
  - version: v2026-10
    date: October 4, 2026
    summary: Quarterly review — every AI touchpoint listed, Stripe, MailerLite and Formspree disclosed, backup retention and session recordings added.
  - version: v2026-07
    date: July 16, 2026
    summary: Encrypted vaults for email and birth data, managed-key Cloud KMS, no names stored, and the automated privacy check.
  - version: v2026-06
    date: June 8, 2026
    summary: Review prompted by the business liability and cyber insurance policy.
  - version: v2026-05d
    date: May 20, 2026
    summary: Corrections to the May 20 versions.
  - version: v2026-05b
    date: May 20, 2026
    summary: Just-in-time AI privacy notices.
  - version: v2026-05
    date: May 20, 2026
    summary: Full policy review.
  - version: v2025-01
    date: January 1, 2025
    summary: First publication.

terms:
  - version: v2026-10b
    date: October 20, 2026
    summary: Cancelling stops the next renewal; the account stays open until the end of the paid period, then closes and is deleted permanently (it said cancellation was immediate). Practitioners can cancel in Settings → Manage billing.
  - version: v2026-10
    date: October 18, 2026
    summary: Brought in line with the shipped platform — all four practitioner tiers, client invitation and consent, practitioner AI on the practitioner's own key, the HIPAA and BAA position, and research use matched to the Privacy Policy.
  - version: v2026-08
    date: August 16, 2026
    summary: Moved into the website; Google Sign-In terms added.
  - version: v2026-05
    date: May 2026
    summary: First publication.

health_data:
  - version: v2026-10d
    date: October 20, 2026
    summary: Deleted files clear from storage within 14 days (was 7), because file storage now keeps a deleted file's earlier version for 7 days before its 7-day recovery copy.
  - version: v2026-10c
    date: October 20, 2026
    summary: Stopping sharing with a practitioner deletes nothing; your records close to them, and the notes they wrote about you stay theirs to keep, edit or delete.
  - version: v2026-10b
    date: October 19, 2026
    summary: Deleting your data now says that deleted files clear from storage within 7 days, as well as aging out of the encrypted backups within 98 days.
  - version: v2026-10
    date: October 19, 2026
    summary: First edition. The consumer health data TMG collects and why, where it comes from, who receives it, and how to use your rights and appeal (Washington My Health My Data Act and similar state laws).
