# Version history for the site's published documents (Security Brief, Privacy
# Policy, Terms of Service). Newest first. The first entry of each list is the
# current version: its stamp shows at the top of the page (_includes/doc-version.html)
# and the whole list shows at the bottom (_includes/version-history.html).
# Version names follow the privacy policy's scheme: vYYYY-MM, then a letter
# suffix (b, c, ...) for a further version in the same month.
# Privacy details: legal/PRIVACY_CHANGELOG.md. Update both in the same commit.

security:
  - version: v2026-10b
    date: October 18, 2026
    summary: Published on the website. Every statement re-checked against the code and the live system; wording corrected where the October 13 edition overstated the controls, and the documents offered on request limited to those that exist; a third-party penetration test is arranged on request.
  - version: v2026-10
    date: October 13, 2026
    summary: First edition, a two-page PDF.

privacy:
  - version: v2026-10e
    date: October 19, 2026
    summary: The website contact form is handled by Triple Moon Goddess's own server instead of Formspree; it asks for no name, stores nothing, and its email to Lisa is deleted after 30 days. Formspree removed from the processors.
  - version: v2026-10d
    date: October 19, 2026
    summary: US-only. TMG offers its services in the United States and does not target people elsewhere; the GDPR, UK, Brazil, Canada and Australia sections and GDPR legal-basis wording are replaced by one set of rights for everyone, California and other states, a written appeal process, and the new Consumer Health Data Privacy Policy (Washington My Health My Data Act).
  - version: v2026-10c
    date: October 18, 2026
    summary: Data location corrected — TMG's databases, files, backups, keys and servers are in the United States only (the earlier "US and EU data centres" was not accurate). Chart emails now carry a newsletter unsubscribe link.
  - version: v2026-10b
    date: October 18, 2026
    summary: Brought in line with the BAA-readiness changes shipped October 7–18, 2026 — client sign-in by email link, two-step sign-in for practitioners, keyed email fingerprints, practitioner AI on the practitioner's own key, invitation and consent for practitioner clients, audit-log and link retention, and the mailbox purge.
  - version: v2026-10
    date: October 4, 2026
    summary: Quarterly review — every AI touchpoint listed, Stripe, MailerLite and Formspree disclosed, backup retention and session recordings added.
  - version: v2026-07
    date: July 16, 2026
    summary: Encrypted vaults for email and birth data, managed-key Cloud KMS, no names stored, and the automated privacy check.
  - version: v2026-06
    date: June 8, 2026
    summary: Review prompted by the business liability and cyber insurance policy.
  - version: v2026-05d
    date: May 20, 2026
    summary: Corrections to the May 20 versions.
  - version: v2026-05b
    date: May 20, 2026
    summary: Just-in-time AI privacy notices.
  - version: v2026-05
    date: May 20, 2026
    summary: Full policy review.
  - version: v2025-01
    date: January 1, 2025
    summary: First publication.

terms:
  - version: v2026-10
    date: October 18, 2026
    summary: Brought in line with the shipped platform — all four practitioner tiers, client invitation and consent, practitioner AI on the practitioner's own key, the HIPAA and BAA position, and research use matched to the Privacy Policy.
  - version: v2026-08
    date: August 16, 2026
    summary: Moved into the website; Google Sign-In terms added.
  - version: v2026-05
    date: May 2026
    summary: First publication.

health_data:
  - version: v2026-10
    date: October 19, 2026
    summary: First edition. The consumer health data TMG collects and why, where it comes from, who receives it, and how to use your rights and appeal (Washington My Health My Data Act and similar state laws).
