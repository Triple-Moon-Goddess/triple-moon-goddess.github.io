# Version history for the site's published documents (Security Brief, Privacy
# Policy, Terms of Service). Newest first. The first entry of each list is the
# current version: its stamp shows at the top of the page (_includes/doc-version.html)
# and the whole list shows at the bottom (_includes/version-history.html).
# Version names follow the privacy policy's scheme: vYYYY-MM, then a letter
# suffix (b, c, ...) for a further version in the same month.

security:
  - version: v2026-11l
    date: November 17, 2026
    summary: "When a client deletes their data, the record that they signed the consent form and of their answer about being recorded is kept, filed under a code derived from the client's email address, without the name, signature or email address, and marked with the date of the delete. A sales export is no longer an accepted reason for the administrator to read a client's stored birth data back; it stays a reason for the email lookups. Corrects the alert count to 13 breach and backup alerts, and adds the alert that emails and texts Lisa when the server carrying our calls to payment, newsletter, AI and place-lookup services is running but has stopped working."
  - version: v2026-11k
    date: November 16, 2026
    summary: "The administrator must choose a reason from a fixed list before reading a client’s stored birth data back; each such lookup is logged with the administrator’s account and the reason, and kept 6 years. Adds a short guide to who is responsible for what."
  - version: v2026-11j
    date: November 16, 2026
    summary: "Our server functions now refuse app requests without a valid App Check token, and replace any person’s email address in a log line with a fingerprint before it is written."
  - version: v2026-11i
    date: November 14, 2026
    summary: "The administrator signs in with a hardware security key and its PIN; practitioners may choose one instead of an authenticator app. Fingerprint, face and phone passkeys are refused, and recovery codes are stored as hashes. Corrects the rate-limit counter line: short counters are deleted after their window, the old AI-summary counters after 30 days."
  - version: v2026-11h
    date: November 10, 2026
    summary: A fifth application-error alert emails Lisa when our servers fail to check a sign-in, for example because Google’s sign-in keys cannot be reached.
  - version: v2026-11g
    date: November 5, 2026
    summary: A twelfth breach alert emails and texts Lisa whenever a person changes who can access anything in the production Google Cloud project.
  - version: v2026-11f
    date: November 5, 2026
    summary: New logs are stored in the United States. A completed CSA CAIQ v4.1 questionnaire is available on request. The alert count is corrected to 11 breach and backup alerts, 6 with 24-hour checks (the client-file deletion alert added November 2 was not counted).
  - version: v2026-11e
    date: November 3, 2026
    summary: A third-party penetration test is available once there is a revenue commitment, not arranged on request.
  - version: v2026-11d
    date: November 2, 2026
    summary: The separate export vault keeps backups 90 days instead of 30, under the same locked retention policy; backups age out within 100 days.
  - version: v2026-11c
    date: November 2, 2026
    summary: Adds the Family Astrology practitioner tier.
  - version: v2026-11b
    date: November 2, 2026
    summary: Requests that fail Google reCAPTCHA are still answered, but share a small hourly allowance per network on the functions that create records, send mail or reach a paid service.
  - version: v2026-11
    date: November 1, 2026
    summary: A client's delete, and anything else that acts on an email, needs that email proved first.
  - version: v2026-10f
    date: October 30, 2026
    summary: There are now 4 application-error alerts. The new one fires when a function repeatedly fails to start.
  - version: v2026-10e
    date: October 20, 2026
    summary: Requests from the apps carry a Firebase App Check token from Google reCAPTCHA Enterprise; requests without one are counted and, for now, still answered.
  - version: v2026-10d
    date: October 20, 2026
    summary: Deleting client data also deletes the client's MailerLite subscriber, booking events and Stripe customer, retrying and alerting Lisa if a step fails. Records of app use, AI rate counters and unused anonymous sessions are deleted automatically. What the logs hold is stated exactly, including the email addresses some entries carry. Every production release is first scanned with Semgrep against our own security rules, offline, and any finding stops it. A tenth breach alert watches for changes to the email encryption key's versions.
  - version: v2026-10c
    date: October 20, 2026
    summary: Deleting client data removes every sign-in account that held only that client's records, not just the email sign-in. A cancelled practitioner's records are deleted when the paid period ends, not at the moment of cancelling.
  - version: v2026-10b
    date: October 18, 2026
    summary: Published on the website. Every statement re-checked against the code and the live system; wording corrected where the October 13 edition overstated the controls, and the documents offered on request limited to those that exist; a third-party penetration test is arranged on request.
  - version: v2026-10
    date: October 13, 2026
    summary: First edition, a two-page PDF.

privacy:
  - version: v2026-11j
    date: November 17, 2026
    summary: "When you delete your data we keep the record that you signed our consent form and of your answer about being recorded, filed under a code derived from your email address, without your name, signature or email address, marked with the date of the deletion; it also says whether your email address had been confirmed and, for an answer given out loud, when and by which administrator account it was recorded (Summary, Sections VIII and XII). If a data breach affects your information, we will notify you no later than 30 calendar days after we discover it (Section IX). Corrects the Stripe card: the reading question (until October 18, 2026) and the access code and email address in the order details (until October 5, 2026) were sent to Stripe with earlier payments, and we removed them from those payment records on November 17, 2026 (Section V)."
  - version: v2026-11i
    date: November 16, 2026
    summary: "Lisa, as administrator, must choose a reason from a fixed list before reading your stored birth data back; her account and the reason are recorded each time and kept 6 years (Summary, Sections VIII and IX)."
  - version: v2026-11h
    date: November 16, 2026
    summary: "Our server functions now refuse app requests without a valid App Check token from Google reCAPTCHA Enterprise (Section V)."
  - version: v2026-11g
    date: November 14, 2026
    summary: "Adds hardware security keys (such as a YubiKey) for two-step sign-in: what we store for each key and its recovery codes, and how long. We never receive the key’s PIN. Separates short rate-limit counters, such as recovery-code tries, from the old AI summary counters, and says what they hold and when they are deleted."
  - version: v2026-11f
    date: November 10, 2026
    summary: A chart email adds you to the newsletter list only if you tick "Do you want to receive a newsletter", which starts unticked. Adds the practitioner's follow-up email draft to the AI touchpoints, and how practitioners log follow-ups.
  - version: v2026-11e
    date: November 5, 2026
    summary: Our logs are stored in the United States since November 5, 2026; older entries stay in Google's global storage until their retention ends.
  - version: v2026-11d
    date: November 3, 2026
    summary: TMG never adds a name, email or access code to an AI request, but what a person types is sent as written; Journal Chat removes typed email addresses and phone numbers first, and the server refuses AI requests sent without the current notice.
  - version: v2026-11c
    date: November 2, 2026
    summary: The isolated backup copy is kept 91 days instead of 31, so a deleted record ages out of every backup within 100 days instead of 98.
  - version: v2026-11b
    date: November 2, 2026
    summary: Adds the Family Astrology app and its Family AI, what it sends to Anthropic and the notice it shows first.
  - version: v2026-11
    date: November 1, 2026
    summary: Deleting your data now first asks you to open a sign-in link emailed to you; a one-way hash of your IP address is briefly counted to slow repeated tries.
  - version: v2026-10m
    date: October 30, 2026
    summary: Corrected after a full review of the in-app consent text. Journal chat sends 14 days of journal and is saved; email is also sealed on a practitioner link and a signed waiver; a signed waiver holds your name; where recording answers are stored.
  - version: v2026-10l
    date: October 21, 2026
    summary: Google Workspace, which carries our business email and calendar, stores that data at rest in the United States under our Workspace data region setting; it may still transmit and process it in other countries.
  - version: v2026-10k
    date: October 21, 2026
    summary: Emails that carry your data are sent through the Gmail API with permission to send only, instead of over SMTP with a mail password. Nothing else about what is sent, to whom, or how long our copies are kept changes.
  - version: v2026-10j
    date: October 20, 2026
    summary: Google reCAPTCHA Enterprise, through Firebase App Check, runs on every app page to tell our own pages apart from automated scripts. It receives browser, device and page-use information, never your name, email, access code, birth, health or journal data. Two new storage entries (_grecaptcha and the App Check token), and Google may set its own security cookie.
  - version: v2026-10i
    date: October 20, 2026
    summary: Deleted files clear from storage within 14 days. File storage now keeps a deleted file's earlier version for 7 days before the 7-day recovery copy, so a deleted reading PDF, video or preview is fully gone within 14 days. The isolated backup copy is kept 31 days, and its recovery copy is removed within about 9 more days.
  - version: v2026-10h
    date: October 20, 2026
    summary: Where your data is says where each processor stores it (Anthropic in the US, Stripe including the US and India, MailerLite in the European Union, Google Workspace wherever Google has facilities); only TMG's own systems are US-only. Records of which app a session opened are deleted after 1 year, old AI summary counters after 30 days, and anonymous sign-in sessions after a year unused. Deleting your data also deletes your MailerLite subscriber record, your booking events (a future session is cancelled) and your Stripe customer record. The log rows say exactly which entries hold an email address.
  - version: v2026-10g
    date: October 20, 2026
    summary: The Health Journal also exports Markdown with a machine-readable copy; deleting your data also removes an anonymous sign-in that held only your charts; stopping sharing with a practitioner deletes nothing; your records close to them, and the notes they wrote stay theirs.
  - version: v2026-10f
    date: October 19, 2026
    summary: Deleted files clear from storage within 7 days. A deleted reading PDF's recovery copy is removed automatically within 7 days, and video readings and previews are deleted about 7 days after they are made, with their recovery copy removed within 7 more days.
  - version: v2026-10e
    date: October 19, 2026
    summary: The website contact form is handled by Triple Moon Goddess's own server instead of Formspree; it asks for no name, stores nothing, and its email to Lisa is deleted after 30 days. Formspree removed from the processors.
  - version: v2026-10d
    date: October 19, 2026
    summary: US-only. TMG offers its services in the United States and does not target people elsewhere; the GDPR, UK, Brazil, Canada and Australia sections and GDPR legal-basis wording are replaced by one set of rights for everyone, California and other states, a written appeal process, and the new Consumer Health Data Privacy Policy (Washington My Health My Data Act).
  - version: v2026-10c
    date: October 18, 2026
    summary: Data location corrected — TMG's databases, files, backups, keys and servers are in the United States only (the earlier "US and EU data centres" was not accurate). Chart emails now carry a newsletter unsubscribe link.
  - version: v2026-10b
    date: October 18, 2026
    summary: Brought in line with the BAA-readiness changes shipped October 7–18, 2026 — client sign-in by email link, two-step sign-in for practitioners, keyed email fingerprints, practitioner AI on the practitioner's own key, invitation and consent for practitioner clients, audit-log and link retention, and the mailbox purge.
  - version: v2026-10
    date: October 4, 2026
    summary: Quarterly review — every AI touchpoint listed, Stripe, MailerLite and Formspree disclosed, backup retention and session recordings added.
  - version: v2026-07
    date: July 16, 2026
    summary: Encrypted vaults for email and birth data, managed-key Cloud KMS, no names stored, and the automated privacy check.
  - version: v2026-06
    date: June 8, 2026
    summary: Review prompted by the business liability and cyber insurance policy.
  - version: v2026-05d
    date: May 20, 2026
    summary: Corrections to the May 20 versions.
  - version: v2026-05b
    date: May 20, 2026
    summary: Just-in-time AI privacy notices.
  - version: v2026-05
    date: May 20, 2026
    summary: Full policy review.
  - version: v2025-01
    date: January 1, 2025
    summary: First publication.

terms:
  - version: v2026-11c
    date: November 14, 2026
    summary: "Adds hardware security keys for two-step sign-in (required for the administrator, optional for practitioners), keeping the keys and recovery codes safe, and their deletion when a subscription ends."
  - version: v2026-11b
    date: November 10, 2026
    summary: Practitioners may keep session notes in the Soul Journal, encrypted and readable only by them and the administrator; a HIPAA-covered practice needs a signed BAA first.
  - version: v2026-11
    date: November 2, 2026
    summary: Adds the Family Astrology practitioner tier ($150/month or $1,500/year).
  - version: v2026-10b
    date: October 20, 2026
    summary: Cancelling stops the next renewal; the account stays open until the end of the paid period, then closes and is deleted permanently (it said cancellation was immediate). Practitioners can cancel in Settings → Manage billing.
  - version: v2026-10
    date: October 18, 2026
    summary: Brought in line with the shipped platform — all four practitioner tiers, client invitation and consent, practitioner AI on the practitioner's own key, the HIPAA and BAA position, and research use matched to the Privacy Policy.
  - version: v2026-08
    date: August 16, 2026
    summary: Moved into the website; Google Sign-In terms added.
  - version: v2026-05
    date: May 2026
    summary: First publication.

health_data:
  - version: v2026-11
    date: November 3, 2026
    summary: TMG never adds a name, email or birth data to an AI request, but what you type is sent as you wrote it; Journal Chat removes email addresses and phone numbers first.
  - version: v2026-10e
    date: October 20, 2026
    summary: Google's reCAPTCHA, which checks that requests come from our own app pages, is listed among our processors; it receives browser, device and page-use information, never your answers, journal or birth data.
  - version: v2026-10d
    date: October 20, 2026
    summary: Deleted files clear from storage within 14 days (was 7), because file storage now keeps a deleted file's earlier version for 7 days before its 7-day recovery copy.
  - version: v2026-10c
    date: October 20, 2026
    summary: Stopping sharing with a practitioner deletes nothing; your records close to them, and the notes they wrote about you stay theirs to keep, edit or delete.
  - version: v2026-10b
    date: October 19, 2026
    summary: Deleting your data now says that deleted files clear from storage within 7 days, as well as aging out of the encrypted backups within 98 days.
  - version: v2026-10
    date: October 19, 2026
    summary: First edition. The consumer health data TMG collects and why, where it comes from, who receives it, and how to use your rights and appeal (Washington My Health My Data Act and similar state laws).
